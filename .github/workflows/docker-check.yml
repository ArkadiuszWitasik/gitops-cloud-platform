name: Docker check
on: [workflow_dispatch]
env: 
  ECR_URI: ${{secrets.ECR_URI}}
  SHORT_SHA: "${GITHUB_SHA::7}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Build docker image
        # run: docker build -t $ECR_URI:$(date +"%F_%H%M%S") ./web-app/
        run: docker build -t web-app:$SHORT_SHA ./web-app/
      - name: Check if docker image was built 
        run: docker images
      - name:  Tag docker image for AWS ECR
        run: docker tag web-app:$SHORT_SHA $ECR_URI:$SHORT_SHA
      - name: Check if docker tags was changed 
        run: docker images